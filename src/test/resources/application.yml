spring:
  datasource:
    url: jdbc:h2:mem:fila-atendimento-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 0

security:
  jwt:
    secret: chave-secreta-de-assinatura-exclusiva-para-testes-32
    validity-seconds: 3600
    issuer: fila-atendimento-api-test
  cors:
    allowed-origins: "*"
  initial-users:
    users:
      - name: Administrador de Teste
        login: admin@test.fila
        password: SenhaAdmin@Test
        role: ADMIN
      - name: Atendente de Teste
        login: atendente@test.fila
        password: SenhaAtendente@Test
        role: ATTENDANT

attendance:
  max-consecutive-priority: 2

logging:
  level:
    root: WARN
